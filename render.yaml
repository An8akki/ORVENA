services:
  - type: web
    name: orvena-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade 20261022_launchpad_guide && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: FRONTEND_ORIGIN
        value: https://*.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://*.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
